<!doctype html>
<html lang="es" data-brand="gil">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Control de peso, Farmacia Gil Solano y Farmacia Caribe</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#1B6B54">
<meta name="apple-mobile-web-app-title" content="Mostrador">
<link rel="manifest" href="manifest-mostrador.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-mostrador-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon-mostrador.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,500..800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F2F5F3; --surface:#FFFFFF; --ink:#14261F; --ink-2:#4A5E56; --line:#D3DCD7;
  --warn:#7A4F00; --warn-soft:#FBEFD0; --alert:#A3301E; --alert-soft:#FADED8;
  --brand:#1B6B54; --brand-fg:#FFFFFF; --brand-soft:#DFF0E9; --brand-ink:#14503F;
  --tile:#1B6B54; --tile-fg:#FFFFFF;
  --shadow:0 -12px 40px rgba(12,24,20,.28);
  --f-display:"Bricolage Grotesque","Trebuchet MS","Segoe UI",system-ui,sans-serif;
  --f-text:"Atkinson Hyperlegible","Segoe UI",Roboto,system-ui,sans-serif;
}
:root[data-brand="caribe"]{ --brand:#0F6C8F; --brand-soft:#DDEEF6; --brand-ink:#0B516C; --tile:#0F6C8F; }

@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1815; --surface:#16231F; --ink:#E7EFEB; --ink-2:#9EB1A9; --line:#2B3C36;
    --warn:#F2C76E; --warn-soft:#3A2E12; --alert:#F3A091; --alert-soft:#40201A;
    --brand:#62C9A9; --brand-fg:#0B1512; --brand-soft:#17342C; --brand-ink:#8ADCC2;
    --shadow:0 -12px 40px rgba(0,0,0,.55);
  }
  :root:not([data-theme="light"])[data-brand="caribe"]{ --brand:#6CC3E6; --brand-soft:#14303D; --brand-ink:#97D6F0; }
}
:root[data-theme="dark"]{
  --bg:#0E1815; --surface:#16231F; --ink:#E7EFEB; --ink-2:#9EB1A9; --line:#2B3C36;
  --warn:#F2C76E; --warn-soft:#3A2E12; --alert:#F3A091; --alert-soft:#40201A;
  --brand:#62C9A9; --brand-fg:#0B1512; --brand-soft:#17342C; --brand-ink:#8ADCC2;
  --shadow:0 -12px 40px rgba(0,0,0,.55);
}
:root[data-theme="dark"][data-brand="caribe"]{ --brand:#6CC3E6; --brand-soft:#14303D; --brand-ink:#97D6F0; }

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-text);font-size:1rem;line-height:1.45;-webkit-font-smoothing:antialiased}
h1,h2,h3,p,ul,ol{margin:0;padding:0}
ul,ol{list-style:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
[hidden]{display:none !important}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px}

.shell{max-width:30rem;margin:0 auto;min-height:100vh;min-height:100dvh;padding-bottom:calc(5.5rem + env(safe-area-inset-bottom))}

/* Barra superior */
.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:.75rem;padding:.7rem 1rem;background:var(--bg);border-bottom:1px solid var(--line)}
.tile{width:2.75rem;height:2.75rem;border-radius:.8rem;background:var(--tile);display:grid;place-items:center;flex:none}
.tile svg{width:2rem;height:2rem;display:block}
.wordmark{flex:1;min-width:0;line-height:1.1}
.wordmark small{display:block;font-size:.8125rem;color:var(--ink-2)}
.wordmark strong{display:block;font-family:var(--f-display);font-size:1.4rem;font-weight:700;letter-spacing:-.015em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* Pestañas */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;display:flex;justify-content:center;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.tabs-in{display:grid;grid-template-columns:repeat(4,1fr);width:100%;max-width:30rem}
.tab{position:relative;background:none;border:0;padding:.6rem .25rem .55rem;display:grid;justify-items:center;gap:.1rem;font-size:.8125rem;color:var(--ink-2);min-height:3.6rem}
.tab svg{width:1.5rem;height:1.5rem}
.tab[aria-current="page"]{color:var(--brand-ink);font-weight:700}
.tab[aria-current="page"]::before{content:"";position:absolute;top:-1px;left:28%;right:28%;height:3px;border-radius:0 0 3px 3px;background:var(--brand)}

/* Contenido */
.view{padding:1.1rem 1rem 0}
.fecha{color:var(--ink-2);font-size:.9375rem}
.fecha::first-letter{text-transform:uppercase}
.titular{font-family:var(--f-display);font-weight:700;font-size:2rem;line-height:1.06;letter-spacing:-.025em;margin:.2rem 0 .45rem}
.bajada{color:var(--ink-2)}
.bajada b{color:var(--alert)}
.h-vista{font-family:var(--f-display);font-weight:700;font-size:1.6rem;letter-spacing:-.02em;line-height:1.1}
.muted{color:var(--ink-2);font-size:.9375rem}

.grupo{margin-top:1.6rem}
.grupo > h2{font-family:var(--f-display);font-size:1.0625rem;font-weight:600;margin-bottom:.45rem}
.lista{background:var(--surface);border:1px solid var(--line);border-radius:.9rem;overflow:hidden}
.fila{display:flex;align-items:center;gap:.6rem;padding:.75rem .85rem .75rem .7rem;border-left:.3rem solid var(--line)}
.fila + .fila{border-top:1px solid var(--line)}
.fila[data-estado="hoy"]{border-left-color:var(--brand)}
.fila[data-estado="atrasado"]{border-left-color:var(--alert)}
.fila[data-estado="pausa"]{opacity:.65}
.fila-main{flex:1;min-width:0;display:grid;gap:.1rem;text-align:left;background:none;border:0;padding:.1rem 0;min-height:2.75rem}
.fila-nombre{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fila-det,.fila-cuando{color:var(--ink-2);font-size:.9375rem}
.fila-cuando::first-letter,.cap::first-letter{text-transform:uppercase}
.fila[data-estado="atrasado"] .fila-cuando{color:var(--alert);font-weight:700}
.fila[data-estado="hoy"] .fila-cuando{color:var(--brand-ink);font-weight:700}
.tag{font-style:normal;font-weight:400;font-size:.8125rem;color:var(--ink-2);border:1px solid var(--line);border-radius:999px;padding:.05rem .45rem;margin-left:.3rem}

.aviso{margin-top:1rem;padding:.7rem .85rem;border-radius:.7rem;background:var(--brand-soft);color:var(--brand-ink);font-size:.9375rem;display:flex;gap:.6rem;align-items:center;justify-content:space-between}
.aviso-alert{background:var(--alert-soft);color:var(--alert)}
.vacio{margin-top:1.4rem;padding:1.2rem 1rem;border:1px dashed var(--ink-2);border-radius:.9rem;text-align:left}
.vacio p{margin-bottom:.9rem}
.resumen{margin-top:1.6rem;padding-top:.9rem;border-top:1px solid var(--line);color:var(--ink-2)}

/* Botones */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.4rem;min-height:2.85rem;padding:.55rem 1.05rem;border-radius:.7rem;border:1px solid transparent;font-weight:700;text-decoration:none;text-align:center}
.btn-p{background:var(--brand);color:var(--brand-fg)}
.btn-s{background:var(--surface);border-color:var(--line);color:var(--ink)}
.btn-t{background:none;color:var(--brand-ink);padding-inline:.4rem}
.btn-d{background:none;color:var(--alert);padding-inline:.4rem}
.btn-dd{background:var(--alert);color:#fff}
.btn-block{width:100%}
.btn-sm{min-height:2.5rem;padding:.35rem .85rem;font-size:.9375rem}
.acciones{display:flex;gap:.6rem;margin-top:1rem}
.acciones .btn{flex:1}

/* Buscador y campos */
.inp{width:100%;min-height:2.95rem;padding:.55rem .75rem;border:1px solid var(--line);border-radius:.6rem;background:var(--bg)}
textarea.inp{min-height:6.5rem;resize:vertical;line-height:1.4}
.view > .inp{background:var(--surface)}
.campo{display:block;margin-top:.95rem}
.campo > span{display:block;font-size:.9375rem;font-weight:700;margin-bottom:.3rem}
.campo small{display:block;color:var(--ink-2);font-size:.875rem;margin-top:.3rem}
.dos{display:grid;grid-template-columns:1fr 1fr;gap:.75rem;align-items:end}
.chips{display:flex;flex-wrap:wrap;gap:.4rem}
.chip{min-height:2.5rem;padding:.3rem .85rem;border-radius:999px;border:1px solid var(--line);background:var(--surface)}
.chip[aria-pressed="true"]{background:var(--brand-soft);border-color:var(--brand);color:var(--brand-ink);font-weight:700}
.check{display:flex;gap:.65rem;align-items:flex-start;margin-top:.95rem}
.check input{width:1.4rem;height:1.4rem;margin:.05rem 0 0;flex:none;accent-color:var(--brand)}
.error{margin-top:.95rem;padding:.6rem .75rem;border-radius:.6rem;background:var(--alert-soft);color:var(--alert);font-weight:700}

/* Ficha del cliente */
.volver{background:none;border:0;padding:.4rem .4rem .4rem 0;color:var(--brand-ink);font-weight:700;min-height:2.75rem}
.nombre{font-family:var(--f-display);font-size:1.7rem;font-weight:700;line-height:1.1;letter-spacing:-.02em}
.receta{margin-top:.8rem;padding:.75rem .9rem;border:1.5px dashed var(--ink-2);border-radius:.5rem;background:var(--surface)}
.receta strong{display:block}
.receta span{display:block;color:var(--ink-2);font-size:.9375rem}
.receta em{display:block;margin-top:.45rem;padding-top:.45rem;border-top:1px solid var(--line);font-style:normal;font-size:.9375rem}
.peso{margin-top:1.4rem}
.peso-act{display:flex;align-items:baseline;gap:.4rem;font-family:var(--f-display)}
.peso-act b{font-size:3.2rem;font-weight:700;letter-spacing:-.035em;line-height:1}
.peso-act span{font-size:1.2rem;font-weight:600;color:var(--ink-2)}
.cambio{margin-top:.25rem}
.cambio b{color:var(--brand-ink)}
.chart{display:block;width:100%;height:auto;margin-top:.7rem}
.chart .eje{stroke:var(--line);stroke-width:1}
.chart .linea{fill:none;stroke:var(--brand);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
.chart .area{fill:var(--brand-soft)}
.chart .pto{fill:var(--surface);stroke:var(--brand);stroke-width:2.5}
.chart text{fill:var(--ink-2);font-size:11px;font-family:var(--f-text)}
.bloque{margin-top:1.5rem}
.bloque > h2{font-family:var(--f-display);font-size:1.0625rem;font-weight:600;margin-bottom:.45rem}
.pluma{display:flex;align-items:center;gap:.22rem;max-width:17rem}
.pluma::before{content:"";width:1.7rem;height:1.15rem;border-radius:.6rem 0 0 .6rem;background:var(--ink-2);flex:none}
.pluma::after{content:"";width:0;height:0;border-block:.34rem solid transparent;border-left:.95rem solid var(--ink-2);flex:none}
.pluma i{display:block;height:1.15rem;flex:1;border-radius:.2rem;background:var(--line)}
.pluma i.q{background:var(--brand)}
.pluma-txt{margin-top:.35rem}
.nube-cab{display:flex;align-items:center;justify-content:space-between;gap:.6rem;margin-bottom:.45rem}
.nube-cab h2{margin:0;font-family:var(--f-display);font-size:1.0625rem;font-weight:600}
.cod-g{width:100%;text-align:center;font-family:var(--f-display);font-size:2.4rem;font-weight:700;letter-spacing:.2em;padding:.4rem .2rem .4rem .5rem;border:0;border-bottom:3px solid var(--brand);background:none;border-radius:0;font-variant-numeric:tabular-nums}
.cod-g:focus{outline:none;border-bottom-color:var(--ink)}
.dato{display:flex;justify-content:space-between;gap:1rem;padding:.6rem .9rem}
.dato + .dato{border-top:1px solid var(--line)}
.dato span:last-child{color:var(--ink-2);text-align:right}
.sellos-f{display:flex;gap:.55rem}
.sellos-f i{width:2.7rem;height:2.7rem;border-radius:50%;border:2px dashed var(--ink-2);display:grid;place-items:center;font-style:normal;font-weight:700;color:var(--ink-2)}
.sellos-f i.s{background:var(--tile);border:0;transform:rotate(-8deg)}
.sellos-f i.s svg{width:70%;height:70%}
.nota{margin-top:.7rem;padding:.65rem .8rem;border-radius:.6rem;font-size:.9375rem}
.nota-warn{background:var(--warn-soft);color:var(--warn)}
.nota-alert{background:var(--alert-soft);color:var(--alert)}
.nota-info{background:var(--brand-soft);color:var(--brand-ink)}
.visita{padding:.75rem .9rem;display:grid;grid-template-columns:1fr auto;gap:.1rem .75rem;align-items:start}
.visita + .visita{border-top:1px solid var(--line)}
.visita .v-fecha{font-weight:700}
.visita .v-peso{font-family:var(--f-display);font-weight:600;font-size:1.0625rem;text-align:right}
.visita .v-det{color:var(--ink-2);font-size:.9375rem}
.visita .v-del{justify-self:end;background:none;border:0;padding:.35rem 0 .35rem .5rem;min-height:2.2rem;color:var(--ink-2);font-size:.875rem;text-decoration:underline}

/* Guía */
.guia-cab{display:flex;align-items:center;gap:.8rem;padding:1rem;border-radius:.9rem;background:var(--tile);color:var(--tile-fg)}
.guia-cab .tile{background:none;width:3rem;height:3rem}
.guia-cab .tile svg{width:3rem;height:3rem}
.guia-cab small{display:block;font-size:.875rem;opacity:.85}
.guia-cab strong{display:block;font-family:var(--f-display);font-size:1.5rem;line-height:1.1;letter-spacing:-.015em}
.guia-intro{margin-top:1rem;padding:.85rem 1rem;border-left:.3rem solid var(--brand);background:var(--surface);border-radius:0 .6rem .6rem 0}
.guia h2{font-family:var(--f-display);font-size:1.3rem;font-weight:700;letter-spacing:-.015em;margin:1.7rem 0 .55rem}
.guia h3{font-size:1rem;font-weight:700;margin:1rem 0 .4rem}
.puntos li{position:relative;padding-left:1.15rem;margin-top:.5rem;max-width:34rem}
.puntos li::before{content:"";position:absolute;left:.1rem;top:.58em;width:.45rem;height:.45rem;border-radius:50%;background:var(--brand)}
.puntos-alerta li::before{background:var(--alert)}
.rutina{background:var(--surface);border:1px solid var(--line);border-radius:.9rem;margin-top:.6rem;overflow:hidden}
.rutina li{display:flex;justify-content:space-between;gap:1rem;padding:.65rem .9rem}
.rutina li + li{border-top:1px solid var(--line)}
.rutina li span:last-child{color:var(--ink-2);white-space:nowrap}
.codigo{margin-top:1rem;display:flex;align-items:center;gap:.9rem;padding:.7rem .9rem;border:1.5px dashed var(--ink-2);border-radius:.6rem;background:var(--surface)}
.codigo b{font-family:var(--f-display);font-size:2rem;font-weight:700;letter-spacing:.1em;line-height:1;font-variant-numeric:tabular-nums}
.codigo span{flex:1;font-size:.9375rem;color:var(--ink-2)}
.qr{margin-top:.6rem;padding:1rem;border:1px solid var(--line);border-radius:.9rem;background:var(--surface);display:grid;grid-template-columns:8.5rem 1fr;gap:1rem;align-items:center}
.qr svg{width:100%;height:auto;display:block;border-radius:.3rem}
.qr p{font-size:.9375rem}
.pie{margin-top:1.6rem;padding-top:.9rem;border-top:1px solid var(--line);color:var(--ink-2);font-size:.9375rem}

/* Ajustes */
.opciones{display:grid;grid-template-columns:1fr 1fr;gap:.6rem}
.opcion{min-height:3.2rem;border-radius:.7rem;border:1px solid var(--line);background:var(--surface);font-weight:700}
.opcion[aria-pressed="true"]{border-color:var(--brand);background:var(--brand-soft);color:var(--brand-ink)}
.pila{display:grid;gap:.55rem}

/* Hoja inferior */
.backdrop{position:fixed;inset:0;z-index:20;background:rgba(8,16,13,.55);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:30rem;max-height:92vh;max-height:92dvh;overflow:auto;background:var(--surface);border-radius:1.25rem 1.25rem 0 0;padding:1rem 1rem calc(1.25rem + env(safe-area-inset-bottom));box-shadow:var(--shadow);animation:sube .22s ease-out}
.sheet-cab{display:flex;align-items:flex-start;justify-content:space-between;gap:.75rem}
.sheet-cab h2{font-family:var(--f-display);font-size:1.35rem;font-weight:700;letter-spacing:-.015em;line-height:1.15;padding-top:.3rem}
.sheet-cab h2:focus{outline:none}
.cerrar{background:none;border:0;width:2.75rem;height:2.75rem;border-radius:50%;display:grid;place-items:center;flex:none;margin:-.3rem -.4rem 0 0}
.cerrar svg{width:1.4rem;height:1.4rem}
@keyframes sube{from{transform:translateY(2rem);opacity:0}to{transform:none;opacity:1}}

.toast{position:fixed;left:50%;top:calc(4.5rem + env(safe-area-inset-top));transform:translateX(-50%);z-index:30;max-width:calc(100% - 2rem);padding:.65rem 1rem;border-radius:.7rem;background:var(--ink);color:var(--bg);font-weight:700;font-size:.9375rem;text-align:center}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
</style>
</head>
<body>
<div class="shell" id="app"></div>
<div id="sheet-root"></div>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
<noscript><p style="padding:1rem">Esta app necesita JavaScript activado.</p></noscript>

  const LOGO = '<svg viewBox="0 0 64 64" fill="none" aria-hidden="true">' +
    '<path d="M45 8 31 34" stroke="var(--tile-fg)" stroke-width="6.5" stroke-linecap="round"/>' +
    '<rect x="8" y="29" width="48" height="8" rx="4" fill="var(--tile-fg)" stroke="var(--tile)" stroke-width="2.5"/>' +
    '<path d="M13 37c0 11 6 18 14 18h10c8 0 14-7 14-18Z" fill="var(--tile-fg)"/>' +
    '<rect x="22" y="54" width="20" height="5" rx="2.5" fill="var(--tile-fg)"/>' +
    '<path d="M32 40.5v10M27 45.5h10" stroke="var(--tile)" stroke-width="3.2" stroke-linecap="round"/></svg>';

  const ICONOS = {
    hoy: '<rect x="3.5" y="5" width="17" height="15" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/><circle cx="12" cy="15" r="1.7" fill="currentColor" stroke="none"/>',

  async function pasarCarne(id, codigo) {
    const c = String(codigo || '').replace(/\D/g, '');
    if (c.length !== 6) return error('El código tiene 6 números.');
    try {
      const v = await fb.db.collection('vinculos').doc(c).get();
      if (!v.exists) return error('Ese código no aparece. Pídale al cliente que lo revise en su teléfono nuevo.');
      await fb.db.collection('clientes').doc(id).update({ uid: v.data().uid, vinculado: fb.ahora() });
      await fb.db.collection('vinculos').doc(c).update({ clienteId: id });
      cerrarSheet(); toast('Listo. El teléfono nuevo carga los datos en unos segundos.');
    } catch (e) { error('No se pudo pasar el carné. Revise el internet e intente de nuevo.'); }
  }

  function grafico(pes) {
    if (pes.length < 2) return '<p class="muted" style="margin-top:.6rem">El gráfico aparece con la segunda pesada.</p>';
    const W = 340, H = 150, pl = 38, pr = 10, pt = 12, pb = 22;
    const xs = pes.map(p => parse(p.fecha).getTime()), ys = pes.map(p => p.peso);
    const dMin = Math.min.apply(null, ys), dMax = Math.max.apply(null, ys);
    let y0 = dMin, y1 = dMax;
    if (y1 - y0 < 2) { const mid = (y0 + y1) / 2; y0 = mid - 1; y1 = mid + 1; }
    const m = (y1 - y0) * 0.18; y0 -= m; y1 += m;
    const x0 = xs[0], x1 = xs[xs.length - 1];
    const X = t => pl + (W - pl - pr) * ((t - x0) / ((x1 - x0) || 1));
    const Y = v => pt + (H - pt - pb) * (1 - (v - y0) / (y1 - y0));
    const P = pes.map((p, k) => [X(xs[k]).toFixed(1), Y(p.peso).toFixed(1)]);
    const linea = P.map(p => p.join(',')).join(' ');
    const area = 'M' + P[0][0] + ',' + (H - pb) + ' L' + P.map(p => p.join(',')).join(' L') + ' L' + P[P.length - 1][0] + ',' + (H - pb) + ' Z';
    return '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Peso de ' + num(pes[0].peso) + ' a ' + num(pes[pes.length - 1].peso) + ' kg entre el ' + fechaCorta(pes[0].fecha) + ' y el ' + fechaCorta(pes[pes.length - 1].fecha) + '">' +
      '<line class="eje" x1="' + pl + '" x2="' + (W - pr) + '" y1="' + Y(dMax).toFixed(1) + '" y2="' + Y(dMax).toFixed(1) + '" stroke-dasharray="3 4"/>' +
      '<line class="eje" x1="' + pl + '" x2="' + (W - pr) + '" y1="' + (H - pb) + '" y2="' + (H - pb) + '"/>' +
      '<path class="area" d="' + area + '"/><polyline class="linea" points="' + linea + '"/>' +
      P.map(p => '<circle class="pto" cx="' + p[0] + '" cy="' + p[1] + '" r="3.4"/>').join('') +
      '<text x="' + (pl - 6) + '" y="' + (Y(dMax) + 4).toFixed(1) + '" text-anchor="end">' + num(dMax) + '</text>' +
      '<text x="' + (pl - 6) + '" y="' + (Y(dMin) + 4).toFixed(1) + '" text-anchor="end">' + num(dMin) + '</text>' +
      '<text x="' + pl + '" y="' + (H - 6) + '">' + fechaCorta(pes[0].fecha) + '</text>' +
      '<text x="' + (W - pr) + '" y="' + (H - 6) + '" text-anchor="end">' + fechaCorta(pes[pes.length - 1].fecha) + '</text></svg>';
  }

      '<em>Dosis según la receta de su médico. La farmacia aplica y lleva el control; no cambia dosis.</em></div>';
    h += '<div class="peso">';
    if (i.act != null) {
      h += '<div class="peso-act"><b>' + num(i.act) + '</b><span>kg</span></div>';
      if (i.pes.length > 1) {
        h += '<p class="cambio">' + (i.cambio < 0 ? '<b>' + num(-i.cambio) + ' kg menos</b> desde el inicio (' + num(-i.pct) + ' %)'

      if (i.imc) h += '<p class="muted">IMC ' + num(i.imc) + '</p>';
      h += grafico(i.pes);
    } else h += '<p class="muted">Sin pesadas registradas. La primera visita fija el peso inicial.</p>';
    h += '</div>';

    h += '<div class="bloque"><h2>Pluma actual</h2>';
    if (i.restantes === null) h += '<p class="muted">Sin aplicaciones registradas.</p>';
    else {
      const tot = Math.min(c.dosisPorPluma, 8);
      let seg = ''; for (let k = 0; k < tot; k++) seg += '<i' + (k < i.restantes ? ' class="q"' : '') + '></i>';
      h += '<div class="pluma" aria-hidden="true">' + seg + '</div><p class="pluma-txt">' +
        (i.restantes === 0 ? 'Sin dosis disponibles' : i.restantes === 1 ? 'Queda 1 de ' + c.dosisPorPluma + ' dosis' : 'Quedan ' + i.restantes + ' de ' + c.dosisPorPluma + ' dosis') + '</p>';
    }
    h += '</div>';

    const enMes = i.vs.length === 0 ? 0 : ((i.vs.length - 1) % 4) + 1; let sf = '';
    for (let k = 0; k < 4; k++) sf += k < enMes ? '<i class="s">' + LOGO + '</i>' : '<i>' + (k + 1) + '</i>';
    h += '<div class="bloque"><h2>Sellos del mes</h2><div class="sellos-f" aria-hidden="true">' + sf + '</div><p class="muted" style="margin-top:.4rem">' + enMes + ' de 4, según las visitas registradas aquí. Debe coincidir con el carné del cliente.</p></div>';

    h += notas(c, i).map(n => '<p class="nota nota-' + n[0] + '">' + esc(n[1]) + '</p>').join('');

    h += '<div class="bloque"><h2>Próxima aplicación</h2><p class="cap">' + (c.activo ? (i.ult ? fechaLarga(i.prox) + ', ' + i.cuando : 'Primera aplicación pendiente') : 'Seguimiento en pausa') + '</p>' +
      '<div class="acciones"><button class="btn btn-p" data-act="visita" data-id="' + c.id + '">Registrar visita</button>' +
      '<button class="btn btn-s" data-act="recordar" data-id="' + c.id + '">Recordatorio</button></div>' +
      '<div class="acciones" style="margin-top:.6rem"><button class="btn btn-s" data-act="editar" data-id="' + c.id + '">Editar datos del cliente</button></div></div>';

    h += '<div class="bloque"><h2>Visitas</h2>';
    if (!i.vs.length) h += '<p class="muted">Todavía no hay visitas.</p>';
    else {
      h += '<div class="lista">' + i.vs.slice().reverse().map(v => {
        const det = [];
        if (v.aplicada) det.push(dosisTxt(v.dosis) + ' mg en ' + String(v.sitio || '').toLowerCase() + (v.plumaNueva ? ', pluma nueva' : ''));
        else det.push('Solo control, sin aplicación');
        if (v.molestias && v.molestias.length) det.push('Molestias: ' + v.molestias.join(', ').toLowerCase());
        if (v.nota) det.push(v.nota);
        return '<div class="visita"><span class="v-fecha">' + fechaCorta(v.fecha) + '</span><span class="v-peso">' + (v.peso ? num(v.peso) + ' kg' : '') + '</span>' +
          '<span class="v-det">' + esc(det.join('. ')) + '</span>' +
          '<button class="v-del" data-act="borrar-visita" data-id="' + c.id + '" data-vid="' + v.id + '">Eliminar</button></div>';
      }).join('') + '</div>';
    }
    h += '</div></section>';
    return h;
  }

  function textoRecordatorio(nombre, farmacia, o) {

    else if (o.dias < 0) t += 'Su cita estaba para el ' + fechaLarga(o.prox) + '. Pase o escríbanos y la reprogramamos.';

  }

  function guardarCliente() {
    const s = ui.sheet, nuevo = !s.cliente;
    const nombre = $('f-nombre').value.trim();
    const med = $('f-med').value;
    const dosis = parseNum($('f-dosis').value);
    const estTxt = $('f-est').value.trim();
    const est = estTxt ? parseNum(estTxt) : null;
    const dpp = parseInt($('f-dpp').value, 10);
    if (!nombre) return error('Escriba el nombre del cliente.');
    if (med === 'otro' && !$('f-otro').value.trim()) return error('Escriba el nombre del medicamento.');
    if (!(dosis > 0)) return error('Anote la dosis semanal que indica la receta.');
    if (est !== null && !(est >= 100 && est <= 230)) return error('La estatura va en centímetros, por ejemplo 165.');
    if (!(dpp >= 1 && dpp <= 12)) return error('Las dosis por pluma van de 1 a 12.');
    if (nuevo && !$('f-receta').checked) return error('Para ingresar al control el cliente debe presentar receta médica vigente.');
    if (nuevo && !$('f-consent').checked) return error('Falta el consentimiento firmado del cliente para registrar sus datos.');
    const datos = { nombre, tel: $('f-tel').value.trim(), estatura: est, med, medOtro: med === 'otro' ? $('f-otro').value.trim() : '', dosis, medico: $('f-medico').value.trim(), dosisPorPluma: dpp };
    let c;
    if (nuevo) {
      c = Object.assign({ id: uid(), farmacia: state.ajustes.farmacia, activo: true, demo: false, creado: iso(today()), visitas: [] }, datos);
      state.clientes.push(c);
    } else {
      c = buscarCliente(s.cliente.id); Object.assign(c, datos); c.activo = !$('f-pausa').checked;
    }
    save(); cerrarSheet(); ui.tab = 'clientes'; ui.clienteId = c.id; render(); window.scrollTo(0, 0); toast('Cliente guardado');
  }
  function guardarVisita(id) {
    const c = buscarCliente(id); if (!c) return;
    const fecha = $('v-fecha').value;
    const peso = parseNum($('v-peso').value);
    const aplicada = $('v-aplicada').checked;
    if (!fecha) return error('Elija la fecha de la visita.');
    if (fecha > iso(today())) return error('La fecha no puede ser futura.');
    if (!(peso >= 25 && peso <= 350)) return error('Anote el peso en kilogramos, por ejemplo 82,4.');
    const v = { id: uid(), fecha, peso: Math.round(peso * 10) / 10, aplicada, dosis: null, sitio: '', plumaNueva: false, molestias: [], nota: $('v-nota').value.trim() };
    if (aplicada) {
      const dosis = parseNum($('f-dosis').value);
      const sitio = document.querySelector('#v-sitios [aria-pressed="true"]');
      if (!(dosis > 0)) return error('Anote la dosis aplicada en mg.');
      if (!sitio) return error('Marque el sitio de aplicación.');
      v.dosis = dosis; v.sitio = sitio.getAttribute('data-v'); v.plumaNueva = $('v-pluma').checked;
    }
    v.molestias = Array.prototype.map.call(document.querySelectorAll('#v-mol [aria-pressed="true"]'), b => b.getAttribute('data-v'));
    c.visitas.push(v);
    if (aplicada) {
      const ult = info(c).ult;
      if (ult && ult.id === v.id) c.dosis = v.dosis;
    }
    save(); cerrarSheet(); render(); toast('Visita guardada');

  async function guardarArchivo(filename, data) {
    if (!downloads) {
      if (enClaude) return toast('Las descargas no están disponibles en esta vista.');
      const blob = data instanceof Blob ? data : new Blob([data], { type: 'application/octet-stream' });
      const href = URL.createObjectURL(blob), a = document.createElement('a');
      a.href = href; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(href), 2000); return toast('Archivo guardado');
    }
    try { await downloads.save({ filename, data }); toast('Archivo guardado'); }
    catch (e) {
      const code = e && e.code;
      if (code === 'declined') return;
      toast(code === 'rate_limited' ? 'Ya hay una descarga pendiente. Intente de nuevo en un momento.' : 'No se pudo guardar el archivo en esta vista.');
    }
  }
  function exportarCSV() {
    const q = v => '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"';
    const filas = [['Farmacia', 'Cliente', 'Teléfono', 'Medicamento', 'Médico', 'Fecha', 'Peso (kg)', 'Se aplicó', 'Dosis (mg)', 'Sitio', 'Pluma nueva', 'Molestias', 'Nota']];
    state.clientes.forEach(c => info(c).vs.forEach(v => filas.push([
      'Farmacia ' + BRANDS[c.farmacia], c.nombre + (c.demo ? ' (ejemplo)' : ''), c.tel, medNombre(c), c.medico, v.fecha,
      v.peso ? String(v.peso).replace('.', ',') : '', v.aplicada ? 'Sí' : 'No', v.aplicada ? String(v.dosis).replace('.', ',') : '',
      v.sitio, v.plumaNueva ? 'Sí' : 'No', (v.molestias || []).join(', '), v.nota])));
    if (filas.length === 1) return toast('Todavía no hay visitas para exportar.');
    guardarArchivo('Control de peso visitas ' + iso(today()) + '.csv', '\uFEFF' + filas.map(f => f.map(q).join(';')).join('\r\n'));
  }
  function restaurar(file) {
    const r = new FileReader();
    r.onload = () => {
      let d = null;
      try { d = JSON.parse(String(r.result)); } catch (e) { d = null; }
      if (!valido(d)) return toast('Ese archivo no es un respaldo de esta app.');
      confirmar('Restaurar respaldo', 'Se reemplazan los datos de este dispositivo por los del archivo (' + d.clientes.length + ' clientes).', 'Restaurar', () => {
        state = d; if (!state.ajustes.tel) state.ajustes.tel = { gil: '', caribe: '' };
        save(); ui.clienteId = null; render(); toast('Respaldo restaurado');
      });
    };
    r.onerror = () => toast('No se pudo leer el archivo.');
    r.readAsText(file);
  }

  }
  function hojaPDF() {
    /* Se busca que la hoja quepa en una sola página: si no cabe, se reduce la letra por pasos. */
    const escalas = [1, 0.96, 0.92, 0.88];
    for (let n = 0; n < escalas.length; n++) { const doc = construirPDF(escalas[n]); if (doc.getNumberOfPages() === 1) return doc; }
    return construirPDF(0.96);
  }
  function qrMatriz(texto) { const q = window.qrcode(0, 'M'); q.addData(texto); q.make(); return q; }
  function qrSVG(texto) {
    const q = qrMatriz(texto), n = q.getModuleCount(), m = 3, t = n + 2 * m; let d = '';
    for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) if (q.isDark(r, c)) d += 'M' + (c + m) + ' ' + (r + m) + 'h1v1h-1z';
    return '<svg viewBox="0 0 ' + t + ' ' + t + '" role="img" aria-label="Código QR de la app del cliente" shape-rendering="crispEdges"><rect width="' + t + '" height="' + t + '" fill="#fff"/><path d="' + d + '" fill="#000"/></svg>';
  }
  let esperaQR = 0;
  function bloqueQR() {
    const url = String(state.ajustes.urlCliente || '').trim();
    let h = '<h2>App para el cliente</h2>';
    if (!url) return h + '<p class="muted">Falta el enlace de la app del cliente. Agréguelo en Ajustes.</p>';
    if (typeof window.qrcode !== 'function') {
      if (esperaQR < 12) { esperaQR++; setTimeout(() => { if (ui.tab === 'guia' && !ui.sheet) render(); }, 700); return h + '<p class="muted">Preparando el código QR.</p>'; }
      return h + '<p class="muted">No se pudo cargar el generador de QR. Revise la conexión y vuelva a abrir esta pestaña.</p>';
    }
    let svg = '';
    try { svg = qrSVG(url); } catch (e) { return h + '<p class="muted">El enlace es demasiado largo para un QR. Revíselo en Ajustes.</p>'; }
    return h + '<div class="qr">' + svg + '<p>El cliente lo escanea con la cámara de su celular y lleva en su teléfono el carné con sellos, sus hábitos, su progreso y esta guía.</p></div>' +
      '<div class="acciones"' + (puedeDescargar() ? '' : ' hidden') + ' data-dl><button class="btn btn-s" data-act="rotulo">Descargar rótulo con el QR</button></div>';
  }
  function rotuloPDF() {
    const url = String(state.ajustes.urlCliente || '').trim();
    const doc = new window.jspdf.jsPDF({ unit: 'pt', format: 'letter' });
    const W = 612, M = 56, b = state.ajustes.farmacia, rgb = RGB[b];
    doc.setFillColor(rgb[0], rgb[1], rgb[2]); doc.rect(0, 0, W, 150, 'F');
    logoPDF(doc, M, 33, 84, rgb);
    doc.setTextColor(255, 255, 255); doc.setFont('helvetica', 'normal'); doc.setFontSize(15); doc.text('Farmacia', M + 106, 66);
    doc.setFont('helvetica', 'bold'); doc.setFontSize(36); doc.text(BRANDS[b], M + 106, 104);
    doc.setTextColor(24, 40, 33); doc.setFontSize(31); doc.text('Lleve su control de peso', M, 212); doc.text('en el celular', M, 248);
    doc.setFont('helvetica', 'normal'); doc.setFontSize(14); doc.setTextColor(74, 94, 86);
    doc.text(doc.splitTextToSize('Carné con sellos por cada control semanal, hábitos del día, su progreso y una guía de alimentación y ejercicio.', W - 2 * M), M, 278);
    const q = qrMatriz(url), n = q.getModuleCount(), lado = 290, x0 = (W - lado) / 2, y0 = 330, u = lado / (n + 6);
    doc.setDrawColor(211, 220, 215); doc.setLineWidth(1); doc.setFillColor(255, 255, 255); doc.roundedRect(x0, y0, lado, lado, 10, 10, 'FD');
    doc.setFillColor(0, 0, 0);
    for (let r = 0; r < n; r++) {
      let c = 0;
      while (c < n) {
        if (!q.isDark(r, c)) { c++; continue; }
        let f = c; while (f < n && q.isDark(r, f)) f++;
        doc.rect(x0 + (c + 3) * u, y0 + (r + 3) * u, (f - c) * u + 0.2, u + 0.2, 'F'); c = f;
      }
    }
    doc.setTextColor(24, 40, 33); doc.setFontSize(14);
    const pasos = ['1. Abra la cámara de su celular y apunte al código.', '2. Toque el enlace que aparece.', '3. Elija Farmacia ' + BRANDS[b] + ' y escriba su nombre.'];
    pasos.forEach((t, k) => doc.text(t, M, 664 + k * 22));
    doc.setFontSize(9.5); doc.setTextColor(88, 104, 97);
    doc.text('Programa de acompañamiento para personas con tratamiento indicado por su médico.', M, 748);
    doc.text(doc.splitTextToSize(url, W - 2 * M)[0], M, 762);
    return doc;
  }
  function descargarRotulo() {
    if (!window.jspdf || !window.jspdf.jsPDF || typeof window.qrcode !== 'function') return toast('No se cargó el generador. Revise la conexión e intente de nuevo.');
    let blob;
    try { blob = rotuloPDF().output('blob'); } catch (e) { return toast('No se pudo generar el rótulo.'); }
    guardarArchivo('Rotulo QR Farmacia ' + BRANDS[state.ajustes.farmacia] + '.pdf', blob);
  }
  function descargarPDF() {
    if (!window.jspdf || !window.jspdf.jsPDF) return toast('No se cargó el generador de PDF. Revise la conexión e intente de nuevo.');
    let blob;
    try { blob = hojaPDF().output('blob'); } catch (e) { return toast('No se pudo generar el PDF.'); }
    guardarArchivo('Guia control de peso Farmacia ' + BRANDS[state.ajustes.farmacia] + '.pdf', blob);
  }

  /* ---------- Eventos ---------- */
  function ir(tab) { ui.tab = tab; ui.clienteId = null; render(); window.scrollTo(0, 0); }

  document.addEventListener('click', ev => {
    const el = ev.target.closest('[data-act]'); if (!el) return;
    const act = el.getAttribute('data-act'), id = el.getAttribute('data-id');
    if (act === 'fondo') { if (ev.target === el) cerrarSheet(); return; }
    switch (act) {
      case 'tab': ir(el.getAttribute('data-tab')); break;
      case 'marca': case 'elegir-marca': {
        const b = act === 'marca' ? (state.ajustes.farmacia === 'gil' ? 'caribe' : 'gil') : el.getAttribute('data-marca');
        state.ajustes.farmacia = b; save(); ui.clienteId = null; ui.nubeId = null; ui.buscar = ''; nubeF.clientes = []; render(); toast('Farmacia ' + BRANDS[b]); cargarNube().then(() => { if (!ui.sheet) render(); }); break;
      }
      case 'ver': ui.tab = 'clientes'; ui.clienteId = id; render(); window.scrollTo(0, 0); break;
      case 'volver': ui.clienteId = null; ui.nubeId = null; render(); window.scrollTo(0, 0); break;
      case 'ver-nube': ui.tab = 'clientes'; ui.clienteId = null; ui.nubeId = id; render(); window.scrollTo(0, 0); break;
      case 'nube-actualizar': cargarNube().then(() => { render(); toast(nubeF.error ? 'Sin conexión' : 'Lista actualizada'); }); break;
      case 'nube-entrar': {
        const correo = $('n-correo').value.trim(), clave = $('n-clave').value, err = $('n-error');
        const decir = m => { err.textContent = m; err.hidden = false; };
        if (!correo || !clave) { decir('Escriba el correo y la contraseña de la farmacia.'); break; }
        if (!fb) { decir('La conexión con la nube todavía no carga. Espere un momento e intente de nuevo.'); break; }
        fb.auth.signInWithEmailAndPassword(correo, clave).catch(e => decir(e && e.code === 'auth/network-request-failed' ? 'No hay internet. Intente de nuevo.' : 'El correo o la contraseña no coinciden.'));
        break;
      }
      case 'nube-salir': if (fb) fb.auth.signOut(); break;
      case 'nube-revisar': if (fb && nubeF.usuario) fb.db.collection('personal').doc(nubeF.usuario.uid).get().then(d => { nubeF.personal = d.exists; return nubeF.personal ? cargarNube() : null; }).then(() => { render(); toast(nubeF.personal ? 'Cuenta autorizada' : 'Todavía no aparece el documento'); }).catch(() => toast('No se pudo revisar. Intente de nuevo.')); break;
      case 'nube-copiar-uid': { const t = nubeF.usuario ? nubeF.usuario.uid : ''; if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(t).then(() => toast('ID copiado'), () => toast('Mantenga presionado el ID para copiarlo.')); else toast('Mantenga presionado el ID para copiarlo.'); break; }
      case 'nube-pasar': abrirSheet({ tipo: 'pasar', id }); break;
      case 'recordar-nube': if (clienteNube(id)) abrirSheet({ tipo: 'recordar', id, nube: true }); break;
      case 'nube-pasar-ok': pasarCarne(id, $('n-codigo').value); break;
      case 'nube-borrar':
        confirmar('Eliminar esta copia de la nube', 'Se borra la copia que guarda la farmacia. Los datos siguen en el teléfono del cliente y, si su app sigue activa, la copia se vuelve a crear.', 'Eliminar', () => {
          fb.db.collection('clientes').doc(id).delete().then(() => { nubeF.clientes = nubeF.clientes.filter(c => c.id !== id); ui.nubeId = null; render(); toast('Copia eliminada'); }).catch(() => toast('No se pudo eliminar. Revise el internet.'));
        }); break;
      case 'nuevo': abrirSheet({ tipo: 'cliente', cliente: null }); break;
      case 'editar': abrirSheet({ tipo: 'cliente', cliente: buscarCliente(id) }); break;
      case 'visita': abrirSheet({ tipo: 'visita', id }); break;
      case 'recordar': abrirSheet({ tipo: 'recordar', id }); break;
      case 'cerrar': cerrarSheet(); break;
      case 'guardar-cliente': guardarCliente(); break;
      case 'guardar-visita': guardarVisita(id); break;
      case 'set-dosis': {
        $('f-dosis').value = dosisTxt(parseFloat(el.getAttribute('data-v')));
        el.parentNode.querySelectorAll('.chip').forEach(c => c.setAttribute('aria-pressed', String(c === el))); break;
      }
      case 'sitio': el.parentNode.querySelectorAll('.chip').forEach(c => c.setAttribute('aria-pressed', String(c === el))); break;
      case 'molestia': el.setAttribute('aria-pressed', String(el.getAttribute('aria-pressed') !== 'true')); break;
      case 'copiar': copiar(); break;
      case 'wa': el.href = 'https://wa.me/' + el.getAttribute('data-tel') + '?text=' + encodeURIComponent($('r-msg').value); break;
      case 'confirmar-ok': { const ok = ui.sheet && ui.sheet.ok; cerrarSheet(); if (ok) ok(); break; }
      case 'borrar-visita':
        confirmar('Eliminar visita', 'Se borra el registro de esta visita. No se puede deshacer.', 'Eliminar', () => {
          const c = buscarCliente(id); if (!c) return;
          c.visitas = c.visitas.filter(v => v.id !== el.getAttribute('data-vid')); save(); render(); toast('Visita eliminada');
        }); break;
      case 'borrar-cliente':
        confirmar('Eliminar cliente', 'Se borran sus datos y todas sus visitas. No se puede deshacer.', 'Eliminar', () => {
          state.clientes = state.clientes.filter(c => c.id !== id); save(); ui.clienteId = null; render(); toast('Cliente eliminado');
        }); break;
      case 'borrar-ejemplos': state.clientes = state.clientes.filter(c => !c.demo); save(); ui.clienteId = null; render(); toast('Ejemplos borrados'); break;
      case 'cargar-ejemplos': state.clientes = state.clientes.concat(ejemplos()); save(); render(); toast('Ejemplos cargados'); break;
      case 'borrar-todo':
        confirmar('Borrar todos los datos', 'Se borran todos los clientes, las visitas y los ajustes de este dispositivo. No se puede deshacer.', 'Borrar todo', () => {
          state = { v: 1, ajustes: ajustesBase(), clientes: [] }; save(); ui.clienteId = null; render(); toast('Datos borrados');
        }); break;
      case 'csv': exportarCSV(); break;
      case 'respaldo': guardarArchivo('Respaldo control de peso ' + iso(today()) + '.json', JSON.stringify(state, null, 1)); break;
      case 'restaurar': { const f = $('archivo'); if (f) { f.value = ''; f.click(); } break; }
      case 'pdf': descargarPDF(); break;
      case 'rotulo': descargarRotulo(); break;
    }
  });

  function copiar() {
    const ta = $('r-msg'); if (!ta) return;
    const listo = () => toast('Mensaje copiado');
    const manual = () => {
      ta.focus(); ta.select();
      let ok = false; try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
      if (ok) listo(); else toast('Mantenga presionado el texto para copiarlo.');
    };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(ta.value).then(listo, manual);
    else manual();
  }

  document.addEventListener('input', ev => {
    const t = ev.target;
    if (t.id === 'buscar') { ui.buscar = t.value; const l = $('lista-clientes'); if (l) l.innerHTML = listaClientes(); }
    else if (t.id === 'f-dosis') {
      const v = parseNum(t.value);
      document.querySelectorAll('#w-chips .chip').forEach(c => c.setAttribute('aria-pressed', String(parseFloat(c.getAttribute('data-v')) === v)));
    }
  });
  document.addEventListener('change', ev => {
    const t = ev.target;
    if (t.id === 'f-med') {
      $('w-otro').hidden = t.value !== 'otro';
      const ini = MEDS[t.value].inicio;
      if (ini) $('f-dosis').value = dosisTxt(ini);
      $('w-chips').innerHTML = chipsDosis(t.value, parseNum($('f-dosis').value));
    } else if (t.id === 'v-aplicada') { $('w-aplic').hidden = !t.checked; }
    else if (t.id === 'archivo') { if (t.files && t.files[0]) restaurar(t.files[0]); }
    else if (t.hasAttribute && t.hasAttribute('data-aj')) {
      const k = t.getAttribute('data-aj'), v = t.value.trim();
      if (k === 'tel.gil') state.ajustes.tel.gil = v; else if (k === 'tel.caribe') state.ajustes.tel.caribe = v; else state.ajustes[k] = v;
      save(); toast('Ajustes guardados');
    }
  });
  document.addEventListener('keydown', ev => { if (ev.key === 'Escape' && ui.sheet) cerrarSheet(); });

  /* ---------- Descargas: se activan cuando la vista las concede ---------- */
  if (window.claude && typeof window.claude.use === 'function') {
    window.claude.use('downloads').then(ns => {
      downloads = ns || null;
      if (!downloads) return;
      document.querySelectorAll('[data-dl], #pdf-wrap').forEach(n => { n.hidden = false; });
    }).catch(() => { downloads = null; });
  }

  render();
  iniciarNube();
})();
</script>
</body>
</html>
